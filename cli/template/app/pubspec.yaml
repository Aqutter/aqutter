name: {{appName}}
description: {{displayName}} - Aqutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  # 3.47.4 is the reference Flutter version the framework is built and tested on.
  # There is deliberately no upper bound: newer Flutter versions can be tried, and `aqutter doctor`
  # warns when the installed Flutter is newer than the reference.
  # `aqutter upgrade` keeps this line in sync with the installed CLI.
  flutter: '>=3.47.4'

dependencies:
  flutter:
    sdk: flutter

  # Aqutter shell. ref is pinned to a tag: change this line to upgrade, and the bump shows up in the diff.
  # To develop the shell locally, switch to a path dependency with `aqutter init --shell-path=<shell dir>`.
  aqutter:
    git:
      url: https://github.com/Aqutter/aqutter.git
      path: shell
      ref: {{shellRef}}

  # aqutter-plugins:begin (maintained by `aqutter plugin`, do not edit by hand)
  # aqutter-plugins:end

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    # Seed web bundle for the first launch (web-bundle.zip is generated by `aqutter seed`; build output is not under version control).
    # Declared as a directory: declaring a single file makes a fresh clone fail at the asset bundling step.
    - assets/seed/
