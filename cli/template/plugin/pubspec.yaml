name: {{dartPackage}}
description: Aqutter plugin — {{id}}.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # App 與 plugin 必須使用同一個殼版本（git ref 相同），否則 pub 會解不出相依。
  aqutter:
    git:
      url: https://github.com/Aqutter/aqutter.git
      path: shell
      ref: {{shellRef}}

  # 需要原生能力時，在這裡加上既有的 Flutter plugin（例如 battery_plus）；
  # 其原生部分由 Flutter 工具鏈在 App 建置時自動整合，不需要額外設定。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
