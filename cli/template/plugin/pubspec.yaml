name: {{dartPackage}}
description: Aqutter plugin - {{id}}.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: '>=3.13.0 <4.0.0'
  # Flutter is pinned to the 3.47 line (3.47.4 is the reference, see .fvmrc).
  # Bump this together with .fvmrc and docs/getting-started.md when the framework upgrades Flutter.
  flutter: '>=3.47.4 <3.48.0'

dependencies:
  flutter:
    sdk: flutter

  # The app and the plugin must use the same shell version (same git ref), otherwise pub cannot resolve the dependencies.
  aqutter:
    git:
      url: https://github.com/Aqutter/aqutter.git
      path: shell
      ref: {{shellRef}}

  # When native capabilities are needed, add an existing Flutter plugin here (e.g. battery_plus);
  # its native part is integrated automatically by the Flutter toolchain at app build time, no extra setup needed.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
