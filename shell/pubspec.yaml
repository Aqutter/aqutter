name: aqutter
description: Aqutter shell - hosts a web app in a Flutter WebView with a local server, OTA bundle updates and a JS bridge.
publish_to: 'none'
version: 0.0.0

environment:
  # The lower bound is this project's baseline SDK (Flutter 3.47.8 / Dart 3.13.7), not the lowest common denominator of the dependencies.
  sdk: '>=3.13.7 <4.0.0'
  # 3.47.8 is the reference Flutter version the framework is built and tested on (see also .fvmrc).
  # There is deliberately no upper bound: newer Flutter versions can be tried, and `aqutter doctor`
  # warns when the installed Flutter is newer than the reference.
  # Bump this together with .fvmrc and docs/getting-started.md when the framework upgrades Flutter.
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter

  # WebView shell + In-App Browser; a single Flutter plugin package, not published to pub.dev.
  # ref is pinned to a tag rather than main: the tag is the anchor, so every version bump is a visible decision in the diff.
  aqutter_core:
    git:
      url: https://github.com/Aqutter/aqutter_core.git
      ref: 0.0.0

  # Embedded local HTTP server (serves the web build from a writable directory, supports hot update)
  shelf: ^1.4.2
  shelf_static: ^1.1.3

  # KV persistence
  shared_preferences: ^2.5.5

  # File system paths
  path_provider: ^2.1.6
  path: ^1.9.1

  # HTTP (download + http_fetch to bypass CORS)
  dio: ^5.11.0

  # Device / battery / network / shell version
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1

  # Permissions / open externally / file picking
  permission_plus: ^1.0.0
  url_launcher: ^6.3.2
  file_picker: ^12.0.0

  # Logging
  logger: ^2.7.0

  # Hot update: extract bundle.zip, verify hashes
  archive: ^4.0.9
  crypto: ^3.0.7
  cryptography: ^2.9.0

  # Built-in native features: system share sheet, deep links (local notifications and the image clipboard are implemented in this package's own native code)
  share_plus: ^13.3.1
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # 殼套件本身也是 Flutter plugin：圖片剪貼簿的原生程式放在各平台資料夾內，不需要各 App 改自己的原生專案。
  plugin:
    platforms:
      android:
        package: com.github.aqutter.shell
        pluginClass: AqutterShellPlugin
      ios:
        pluginClass: AqutterShellPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AqutterShellPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: AqutterShellPluginCApi

  assets:
    # Web-layer fonts (FontBootstrapper copies them to a writable directory; the shelf server serves them at /_flutter/fonts/).
    # Deliberately kept out of the web bundle: hot update downloads the whole zip, so fonts inside it would be re-downloaded on every OTA.
    - assets/fonts/NotoSansCJKtc-VF.woff2
    - assets/fonts/NotoSans-VF.woff2
    # Verification font (bitmap): a successful font load and a fallback to the system font look alike on screen, but a bitmap font is obvious at a glance.
    - assets/fonts/Cubic_11.woff2
