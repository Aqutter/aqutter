name: aqutter
description: Aqutter shell — hosts a web app in a Flutter WebView with a local server, OTA bundle updates and a JS bridge.
publish_to: 'none'
version: 0.0.0

environment:
  # 下限即本專案的基準 SDK（Flutter 3.47.0 / Dart 3.13.0），非各相依的最小公倍數。
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView 殼 + In-App Browser；單一 Flutter plugin 套件，不發佈 pub.dev。
  # ref 釘 tag 而非 main：tag 是不會移動的錨點，每次升版都是 diff 中可見的決定。
  aqutter_core:
    git:
      url: https://github.com/Aqutter/aqutter_core.git
      ref: 0.0.0

  # 內嵌本機 HTTP server（服務可寫目錄的網頁 build，支援熱更新）
  shelf: ^1.4.2
  shelf_static: ^1.1.3

  # 結構化 DB（raw SQL executor）；原生 SQLite 由 sqlite3 3.x 以 Dart build hooks 自行建置
  drift: ^2.34.3
  sqlite3: ^3.5.0

  # KV 持久化
  shared_preferences: ^2.5.5

  # 檔案系統路徑
  path_provider: ^2.1.6
  path: ^1.9.1

  # HTTP（下載 + http_fetch 繞 CORS）
  dio: ^5.11.0

  # 裝置 / 電量 / 網路 / 殼版本
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1

  # 權限 / 外開 / 檔案選擇
  permission_plus: ^1.0.0
  url_launcher: ^6.3.2
  file_picker: ^12.0.0

  # 日誌
  logger: ^2.7.0

  # 熱更新：解壓 bundle.zip、雜湊驗證
  archive: ^4.0.9
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # 網頁層字型（FontBootstrapper 複製到可寫目錄，由 shelf server 掛在 /_flutter/fonts/）。
    # 刻意不放進網頁包：熱更新是整包 zip 全量下載，字型在包內會讓每次 OTA 重付其體積。
    - assets/fonts/NotoSansCJKtc-VF.woff2
    - assets/fonts/NotoSans-VF.woff2
    # 驗證字型（點陣體）：光看畫面分不出「字型載入成功」與「退回系統字型」，點陣體一眼可辨。
    - assets/fonts/Cubic_11.woff2
